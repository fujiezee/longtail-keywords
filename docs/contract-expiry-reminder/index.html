      <h1>合同到期提醒怎么做</h1>
      <p>合同到期提醒怎么做，不要依赖某个人的日历。日历换手机会丢，人休假就没人看。每一份合同单独一行，到期前推给负责人，办完才消失。</p>
      <h2>一行四列</h2>
      <p>合同编号或客户名、负责人、到期日、提前天数。劳动合同、客户合同、供应商合同、授权和证照可以分表，列是一样的。没有负责人的行，先补人。</p>
      <h2>提前天数按来不来得及办</h2>
      <p>要会签、要客户确认的，提前 30 天。只是内部备案的，可以短一些。到期当天的提醒等于没提醒。</p>
      <h2>结果只有几样</h2>
      <p>已续签、不续、延期。状态一变就不要再响。只发过邮件、没有人认这个结果，下周还会漏。</p>
      <p>逐步做法见 <a href="https://doc.duaer.com/zh/guides/expiry-date-reminders/">证书、合同、设备到期自动提醒</a>。</p>
    </article>
