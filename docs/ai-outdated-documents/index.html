      <h1>知识库更新了 AI 还在答旧的</h1>
      <p>知识库更新了，AI 还在答旧的：问答用的不是你刚改的那一份，而是上次导出或同步时留下的副本。新旧两版都还能被搜到时，它会把旧条款说得很肯定。</p>
      <h2>改的地方和读的地方要是同一个</h2>
      <p>人在飞书、网盘或现有系统里改文件。问答如果读的是另存的副本，改完不会自动生效。接上原处，改动之后要重新读那一页。</p>
      <h2>旧版要退出检索</h2>
      <p>作废文件移出索引，不要只在标题上加「旧」。用「年假怎么请」再问一次，出处应是更新后的那一页。点进去对不上，这次更新还没完成。</p>
      <p>见 <a href="https://doc.duaer.com/zh/guides/ai-answers-with-citations/">AI 回答怎么附出处、不胡编</a>。</p>
    </article>
