      <h1>公司制度问答机器人怎么做</h1>
      <p>公司制度问答机器人怎么做：把现行员工手册和制度接上，用员工会问的原话来测，答案必须链回那一条。机器人不背制度，它每次都去原文里找。</p>
      <h2>先列十问，再接全文</h2>
      <p>年假、报销、加班、试用期、离职交接。这十问能点开现行条款，再扩大。制度正文很长，标题却是文件名，问「年假怎么请」会找不到，要把问法写进可检索的标题或开头。</p>
      <h2>不能答的也要设计好</h2>
      <p>没有对应条款，就说没有找到，让人去问负责人。薪资、未公开的处分，提问人在原文系统里看不到，机器人也不能答出来。</p>
      <p>见 <a href="https://doc.duaer.com/zh/guides/ai-assistant-company-documents/">企业知识库 AI 问答怎么搭建</a>。</p>
