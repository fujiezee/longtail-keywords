      <h1>设备保养周期怎么定</h1>
      <p>设备保养周期怎么定，先看厂家维护手册，再看你们实际怎么用。有的按自然日，比如每 90 天；有的按运行小时或产量。两套都有的，哪一个先到就做哪一个。周期写进这台设备的保养规程，不要只写在主管的本子上。</p>
      <h2>一台设备一行</h2>
      <p>设备编号、负责人、上次保养日、下次到期日、按时间还是按运行小时。校准到期另列。混在一起，审核时分不清这台是保养过期还是校准过期。</p>
      <h2>到期前推给干活的人</h2>
      <p>要停机、要备件的，提前几天，备件来得及。结果记成：已保养、送修、停用。做完写上日期。规程原文要能问到，现场不用再翻纸质夹。</p>
      <p>制造场景见 <a href="https://www.duaer.com/industries/manufacturing">制造</a>，校准见 <a href="https://doc.duaer.com/zh/guides/equipment-calibration-tracking/">设备校准到期管理</a>。</p>
