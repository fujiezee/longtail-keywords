      <h1>中小企业 AI 怎么落地</h1>
      <p>中小企业 AI 怎么落地：不要先买一套覆盖全公司的平台。人少、文档就在飞书、网盘或现有办公软件里。先让这些文档能回答十个真问题，再加一张到期清单。</p>
      <h2>没有专职团队也能开始</h2>
      <p>不需要先养一个算法组。负责人点名文档在哪、哪十句每周被问、哪一类日期老是漏。文件留在原地，不搬家。</p>
      <h2>两周能看见的结果</h2>
      <p>第一周：十个问题能答，并且链到原文；普通员工搜不到工资和未公开合同。第二周：合同或证书到期前有人收到提醒，办完有记录。看不到这两件，就不要扩大。</p>
      <p>问答怎么接见 <a href="https://doc.duaer.com/zh/guides/ai-assistant-company-documents/">企业知识库 AI 问答怎么搭建</a>。</p>
