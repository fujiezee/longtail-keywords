      <h1>企业 AI 试点怎么做</h1>
      <p>企业 AI 试点怎么做：一个部门，两周。不要全公司一起上。试点结束时要能说出哪十个问题答对了、哪个账号不该看的文件没搜到、哪张到期表有人办完。</p>
      <h2>试点里只放三样</h2>
      <p>这个部门这周会打开的文档。他们原话里的十个问题。一类到期：合同、证书或校准，选你们真的在漏的那一类。</p>
      <h2>什么算试点通过</h2>
      <p>十问里多数能点开原文。用普通员工账号搜薪资或未公开材料是空的。到期项在到期前出现在负责人那里。演示很顺、这三件没有，试点没有过。</p>
      <p>范围怎么收见 <a href="https://doc.duaer.com/zh/guides/ai-assistant-company-documents/">企业知识库 AI 问答怎么搭建</a>。</p>
