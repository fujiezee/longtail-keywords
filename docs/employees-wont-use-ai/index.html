      <h1>员工不愿意用公司的 AI 怎么办</h1>
      <p>员工不愿意用公司的 AI，多半不是培训不够。他们试过一次：没有出处，或者和群里的说法不一样，下一次就继续问人。强制登录解决不了这个。</p>
      <h2>先修他们试过的那一次</h2>
      <p>挑本周群里问过的十句，保证能答、能点开原文。答不上就明确说没有，不要编一条看起来像制度的话。同一件事只保留现行版。</p>
      <h2>用在已经要办的事上</h2>
      <p>问答之外，把合同到期、证书到期推到负责人。他们为了办这件事先打开，问答才有第二次机会。只在全员会上演示，使用量会回到零。</p>
      <p>出处怎么做见 <a href="https://doc.duaer.com/zh/guides/ai-answers-with-citations/">AI 回答怎么附出处、不胡编</a>。</p>
    </article>
