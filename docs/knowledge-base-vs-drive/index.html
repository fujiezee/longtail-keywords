      <h1>知识库和网盘有什么区别</h1>
      <p>网盘按文件夹放文件，人得知道去哪一层找。知识库按问题找段落：问「年假怎么请」，直接给出手册里的那几句，并链回原文件。文件可以继续留在网盘里，知识库是检索和回答，不是再买一个盘。</p>
      <h2>网盘解决存放，知识库解决问</h2>
      <p>权限仍以网盘为准。他在网盘里打不开的文件夹，知识库也不能搜到。只把文件复制进一个新库，权限往往会变宽。</p>
      <h2>什么时候还不够</h2>
      <p>问答只能回答已经写下来的内容。合同到期、证书到期还要单独盯。网盘里有日期，不代表有人会在到期前看到。</p>
      <p>见 <a href="https://doc.duaer.com/zh/guides/sharepoint-drive-knowledge-base/">把网盘、SharePoint 文件变成能问答的知识库</a>。</p>
    </article>
