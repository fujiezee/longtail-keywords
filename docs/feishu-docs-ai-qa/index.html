      <h1>飞书文档怎么做成 AI 问答</h1>
      <p>飞书文档怎么做成 AI 问答：文档继续留在飞书，不要再导出一份到新库。提问时按这个人在飞书里的权限取出段落，答案链回那一篇。他在飞书打不开的，问答里也不出现。</p>
      <h2>先收会问的，不是全部空间</h2>
      <p>员工手册、制度、操作说明、正在用的项目文档。个人草稿和过期空间先不要索引。标题改成「年假怎么请」这种问法，比「制度汇编 2024」更容易被问中。</p>
      <h2>改完文档，问答要跟上</h2>
      <p>人还是在飞书里改。问答如果停在导出的那一天，就会引用旧条款。接上之后，改动要重新读到。</p>
      <p>网盘和已有文档的接法见 <a href="https://doc.duaer.com/zh/guides/sharepoint-drive-knowledge-base/">把网盘、SharePoint 文件变成能问答的知识库</a>。</p>
    </article>
