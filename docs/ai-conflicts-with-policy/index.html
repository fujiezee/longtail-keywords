      <h1>AI 回答和公司制度不一致怎么办</h1>
      <p>AI 回答和公司制度不一致时，先打开它给的出处。对不上，通常是引用了旧版，或者根本没有出处、是模型补的。改提示词说「请遵守公司制度」解决不了，模型并不知道哪一版算数。</p>
      <h2>只留现行版能被搜到</h2>
      <p>制度更新后，旧文件移出检索，或标成作废并不再索引。同一问题搜到两份年假规则，它就会混着答。</p>
      <h2>对不上就不要答</h2>
      <p>检索结果里没有现行制度，回答应是「没有找到」，而不是用通用劳动法常识补一句。员工要能点开那一页，自己核对句子在不在。</p>
      <p>见 <a href="https://doc.duaer.com/zh/guides/ai-answers-with-citations/">AI 回答怎么附出处、不胡编</a>。</p>
